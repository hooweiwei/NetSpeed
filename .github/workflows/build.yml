name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 + x86_64, package zip & DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取全量历史与 tag，供 build.sh 生成正确的 CFBundleVersion/版本号

      - name: Build & package release artifacts
        run: chmod +x package_release.sh make_dmg.sh && ./package_release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-release
          path: dist/release/
          if-no-files-found: error
