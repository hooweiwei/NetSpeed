name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build app + package DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (swiftc + icns + ad-hoc signing)
        run: chmod +x build.sh && ./build.sh

      - name: Package DMG (make_dmg.sh)
        run: chmod +x make_dmg.sh && ./make_dmg.sh

      - name: Upload built app & DMG
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-macos
          path: |
            NetSpeed.app
            NetSpeed.dmg
          if-no-files-found: error
