name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 + x86_64, package zip & DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & package release artifacts
        run: chmod +x package_release.sh && ./package_release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-release
          path: dist/release/
          if-no-files-found: error
